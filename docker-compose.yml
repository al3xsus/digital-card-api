version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: digital_card_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digital_card
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digital_card"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: digital_card_app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/digital_card?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: